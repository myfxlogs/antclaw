server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Docker 内嵌 DNS：让 nginx 按 TTL 重新解析 upstream 主机名，
    # 避免 api 容器重建换 IP 后仍命中旧地址（症状：connection refused → 502）。
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $api_upstream "api:8080";

    # Reverse-proxy Connect RPC to api service (same-origin, no CORS)
    location ~ ^/antclaw\. {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # SSE real-time endpoints (Jobs / Audit)
    location /sse/ {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
    }

    # Static assets with correct MIME type enforcement
    location /assets/ {
        types {
            application/javascript js mjs;
            text/css css;
            application/json map;
        }
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: only for non-file paths (no dots in URL)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
