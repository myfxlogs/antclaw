name: strategy-tests

on:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Unit tests with coverage
        run: |
          cd backend
          go test ./internal/service/... ./internal/engine/... -race -coverprofile=cover.out
          go tool cover -func=cover.out | tail -1
