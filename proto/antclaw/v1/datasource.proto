syntax = "proto3";

package antclaw.v1;

option go_package = "github.com/antclaw/antclaw/gen/go/antclaw/v1;antclawv1";

service DataSourceService {
  rpc ListDataSources(ListDataSourcesRequest) returns (ListDataSourcesResponse);
  rpc UpdateDataSource(UpdateDataSourceRequest) returns (UpdateDataSourceResponse);
}

message DataSourceConfig {
  string source_id = 1;
  string name = 2;
  string kind = 3;
  string endpoint = 4;
  bool has_secret = 5;
  string updated_at = 6;
  string updated_by = 7;
}

message ListDataSourcesRequest {}

message ListDataSourcesResponse {
  repeated DataSourceConfig items = 1;
}

message UpdateDataSourceRequest {
  string source_id = 1;
  optional string endpoint = 2;
  optional string secret = 3;
  bool clear_secret = 4;
}

message UpdateDataSourceResponse {
  DataSourceConfig item = 1;
}
