syntax = "proto3";

package antclaw.v1;

option go_package = "github.com/antclaw/antclaw/gen/go/antclaw/v1;antclawv1";

import "google/protobuf/timestamp.proto";

service SystemService {
  rpc Healthz(HealthzRequest) returns (HealthzResponse);
  rpc Readyz(ReadyzRequest) returns (ReadyzResponse);
  rpc Info(InfoRequest) returns (InfoResponse);
  rpc GetOnlineUsers(GetOnlineUsersRequest) returns (GetOnlineUsersResponse);
  rpc GetPushStats(GetPushStatsRequest) returns (GetPushStatsResponse);
}

message HealthzRequest {}
message HealthzResponse {
  string status = 1; // healthy | degraded | unhealthy
  map<string, ComponentHealth> components = 2;
  google.protobuf.Timestamp checked_at = 3;
}
message ComponentHealth {
  string name = 1;
  string status = 2; // up | degraded | down
  string detail = 3;
}

message ReadyzRequest {}
message ReadyzResponse { bool ready = 1; }

message InfoRequest {}
message InfoResponse {
  string version = 1;
  string git_commit = 2;
  google.protobuf.Timestamp built_at = 3;
  string proto_version = 4;       // 协议版本，如 "1.0.0"
  string min_client_version = 5;  // 最低兼容客户端版本
  bool maintenance_mode = 6;      // 是否维护模式
  string server_timezone = 7;     // 服务端时区
  int64 server_time = 8;          // 服务端当前 unix 秒
}

message GetOnlineUsersRequest {}

message OnlineUserInfo {
  string user_id = 1;
  string display_name = 2;
  string remote_addr = 3;
  int64 connected_at = 4;         // unix 秒
  string code_id = 5;             // 5 位数字 ID（用户可见）
}

message GetOnlineUsersResponse {
  int32 count = 1;
  repeated OnlineUserInfo users = 2;
}

message GetPushStatsRequest {}

message PushTypeStat {
  string push_type = 1;
  int32 count = 2;
}

message GetPushStatsResponse {
  int64 total_notifications = 1;
  int64 total_push_state_records = 2;
  repeated PushTypeStat by_type = 3;
  int64 recent_1h = 4;
  int64 recent_24h = 5;
}