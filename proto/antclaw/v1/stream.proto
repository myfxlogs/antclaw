syntax = "proto3";

package antclaw.v1;

option go_package = "github.com/antclaw/antclaw/gen/go/antclaw/v1;antclawv1";

// StreamService provides SSE streaming for real-time updates.
// See: AntClaw-重构解决方案.md §6.1
service StreamService {
  // Server-streaming RPC for SSE
  rpc SubscribeEvents(SubscribeEventsRequest) returns (stream SubscribeEventsResponse);
}

// Subscribe to events with optional filter
message SubscribeEventsRequest {
  string channel = 1;
  string last_event_id = 2;
}

// SubscribeEventsResponse represents a streaming event
message SubscribeEventsResponse {
  string id = 1;
  string type = 2;
  string payload = 3;
  string timestamp = 4;
}

// EventChannel enum for channel routing
// See: AntClaw-重构解决方案.md Appendix B.1
// Format: <domain>.<verb> or <domain>.<entity>.<attribute>
enum EventChannel {
  EVENT_CHANNEL_UNSPECIFIED = 0;

  // Price and market data
  EVENT_CHANNEL_PRICE = 1;
  EVENT_CHANNEL_PRICE_TICK = 2;

  // Alerts and notifications
  EVENT_CHANNEL_ALERT = 10;
  EVENT_CHANNEL_ALERT_TRIGGERED = 11;
  EVENT_CHANNEL_NOTIFY_NEW = 12;

  // Signals
  EVENT_CHANNEL_SIGNAL_EMITTED = 20;

  // Tasks and progress
  EVENT_CHANNEL_TASK_PROGRESS = 30;
  EVENT_CHANNEL_BACKTEST = 31;

  // Stream lifecycle
  EVENT_CHANNEL_STREAM_KEEPALIVE = 100;
  EVENT_CHANNEL_STREAM_CLOSED = 101;
}
