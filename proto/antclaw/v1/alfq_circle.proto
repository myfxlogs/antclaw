syntax = "proto3";

package antclaw.v1;

option go_package = "github.com/antclaw/antclaw/gen/go/antclaw/v1;antclawv1";

service CircleService {
  rpc CreateCircle(CreateCircleRequest) returns (Circle);
  rpc JoinCircle(JoinCircleRequest) returns (Circle);
  rpc LeaveCircle(LeaveCircleRequest) returns (LeaveCircleResponse);
  rpc GetCircleFeed(GetCircleFeedRequest) returns (CircleFeedResponse);
  rpc ListCircles(ListCirclesRequest) returns (CircleList);
}

message Circle {
  string id = 1;
  string name = 2;
  string description = 3;
  string symbol = 4;           // associated symbol
  int32 member_count = 5;
  bool is_member = 6;
  int64 created_at = 7;
}

message CreateCircleRequest {
  string name = 1;
  string description = 2;
  string symbol = 3;
}

message JoinCircleRequest { string circle_id = 1; }
message LeaveCircleRequest { string circle_id = 1; }
message LeaveCircleResponse { bool success = 1; }

message GetCircleFeedRequest { string circle_id = 1; string cursor = 2; int32 page_size = 3; }
message CircleFeedResponse {
  repeated CirclePost posts = 1;
  string next_cursor = 2;
}

message CirclePost {
  string id = 1;
  string circle_id = 2;
  string author_name = 3;
  string content = 4;
  int64 created_at = 5;
}

message ListCirclesRequest {}

message CircleList { repeated Circle circles = 1; }
