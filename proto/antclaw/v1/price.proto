syntax = "proto3";

package antclaw.v1;

option go_package = "github.com/antclaw/antclaw/gen/go/antclaw/v1;antclawv1";

// PriceService provides price and market data.
// See: AntClaw-重构解决方案.md §3.3
service PriceService {
  // Get current price for a pair
  rpc GetPrice(GetPriceRequest) returns (GetPriceResponse);

  // Get support/resistance levels
  rpc GetLevels(GetLevelsRequest) returns (GetLevelsResponse);

  // Get market overview
  rpc GetMarketOverview(GetMarketOverviewRequest) returns (GetMarketOverviewResponse);

  // Get trading session info
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);

  // Run scenario analysis
  rpc RunScenario(RunScenarioRequest) returns (RunScenarioResponse);

  // Get market regime classification
  rpc GetRegime(GetRegimeRequest) returns (GetRegimeResponse);

  // Get seasonal analysis
  rpc GetSeasonal(GetSeasonalRequest) returns (GetSeasonalResponse);

  // M-A: Conditional volatility (GARCH(1,1)).
  rpc GetVolatility(GetVolatilityRequest) returns (GetVolatilityResponse);

  // M-A: Hurst exponent (R/S method).
  rpc GetHurst(GetHurstRequest) returns (GetHurstResponse);

  // M-A: Rolling correlation matrix among major assets.
  rpc GetCorrelations(GetCorrelationsRequest) returns (GetCorrelationsResponse);

  // M-A: Price-vs-indicator divergences.
  rpc GetDivergences(GetDivergencesRequest) returns (GetDivergencesResponse);
}

// Price bar
message PriceBar {
  string timestamp = 1;
  string open = 2;
  string high = 3;
  string low = 4;
  string close = 5;
  int64 volume = 6;
}

// GetPrice request
message GetPriceRequest {
  string pair = 1;
  string timeframe = 2; // e.g., "1m", "5m", "1h", "4h", "1d"
  int32 count = 3;
}

// GetPrice response
message GetPriceResponse {
  string pair = 1;
  string current = 2;
  string change_24h = 3;
  string change_pct_24h = 4;
  repeated PriceBar bars = 5;
}

// Support/Resistance level
message PriceLevel {
  string price = 1;
  string type = 2; // support, resistance, pivot
  double strength = 3;
}

// GetLevels request
message GetLevelsRequest {
  string pair = 1;
  string timeframe = 2;
}

// GetLevels response
message GetLevelsResponse {
  string pair = 1;
  repeated PriceLevel levels = 2;
}

// Market overview item
message MarketOverviewItem {
  string pair = 1;
  string price = 2;
  string change_24h = 3;
  string trend = 4; // bullish, bearish, neutral
}

// GetMarketOverview request
message GetMarketOverviewRequest {
  string category = 1; // majors, crosses, all
}

// GetMarketOverview response
message GetMarketOverviewResponse {
  repeated MarketOverviewItem items = 1;
}

// Session info
message SessionInfo {
  string session = 1; // sydney, tokyo, london, new_york
  bool is_open = 2;
  string opens_at = 3;
  string closes_at = 4;
  double volatility_index = 5;
}

// GetSession request
message GetSessionRequest {
  string pair = 1;
}

// GetSession response
message GetSessionResponse {
  string pair = 1;
  repeated SessionInfo sessions = 2;
  string current_session = 3;
}

// Scenario result
message ScenarioResult {
  string scenario_name = 1;
  string outcome = 2;
  double probability = 3;
}

// RunScenario request
message RunScenarioRequest {
  string pair = 1;
  string event_type = 2;
  map<string, string> params = 3;
}

// RunScenario response
message RunScenarioResponse {
  repeated ScenarioResult results = 1;
}

// Market regime
message MarketRegime {
  string regime = 1; // trending, ranging, volatile, calm
  double confidence = 2;
  string since = 3;
}

// GetRegime request
message GetRegimeRequest {
  string pair = 1;
  string timeframe = 2;
  // M-A: classifier engine: "adx" (default, simple) or "hmm" (Gaussian HMM).
  string engine = 3;
  // Optional: number of HMM states (2 or 3); defaults 2 when engine=hmm.
  int32 n_states = 4;
}

// GetRegime response
message GetRegimeResponse {
  MarketRegime regime = 1;
  repeated string recent_regimes = 2;
  // M-A: which engine actually produced the result (may differ on fallback).
  string engine_used = 3;
}

// Seasonal data point
message SeasonalDataPoint {
  string month = 1;
  double avg_return = 2;
  double win_rate = 3;
}

// GetSeasonal request
message GetSeasonalRequest {
  string pair = 1;
  int32 years = 2;
}

// GetSeasonal response
message GetSeasonalResponse {
  string pair = 1;
  repeated SeasonalDataPoint data = 2;
}

// ============================================================
// M-A 增量：GARCH 波动率 / Hurst / 相关矩阵 / 背离
// ============================================================

// GetVolatility request: 计算 GARCH(1,1) 条件波动率。
message GetVolatilityRequest {
  string pair = 1;
  string timeframe = 2; // 默认 1d
  int32 lookback = 3;   // 用最近 N 根 K 线，默认 500，最大 5000
}

// 单个时间点的条件波动率。
message VolatilityPoint {
  string timestamp = 1;
  double conditional_vol = 2;  // 年化标准差（小数，例如 0.18 = 18%）
}

message GetVolatilityResponse {
  string pair = 1;
  // GARCH 拟合参数：sigma^2_t = omega + alpha*r^2_{t-1} + beta*sigma^2_{t-1}
  double omega = 2;
  double alpha = 3;
  double beta = 4;
  double persistence = 5;            // alpha + beta
  double unconditional_vol = 6;       // sqrt(omega/(1-alpha-beta)) 年化
  double next_step_forecast = 7;      // 1 步预测，年化标准差
  repeated VolatilityPoint series = 8;
}

// GetHurst request
message GetHurstRequest {
  string pair = 1;
  string timeframe = 2;
  int32 lookback = 3; // 默认 500
}

message GetHurstResponse {
  string pair = 1;
  double hurst = 2;          // [0, 1]
  string interpretation = 3; // "trending" / "mean_reverting" / "random_walk"
  int32 sample_size = 4;
}

// GetCorrelations request
message GetCorrelationsRequest {
  repeated string assets = 1;  // 资产列表；空时使用默认 8 主流货币对
  string timeframe = 2;
  int32 window = 3;            // 滚动窗 K 线数；默认 30
}

message CorrelationCell {
  string asset_a = 1;
  string asset_b = 2;
  double value = 3;
}

message GetCorrelationsResponse {
  repeated string assets = 1;
  int32 window = 2;
  // 完整 N*N 矩阵（按 assets 顺序），便于前端直接渲染。
  repeated CorrelationCell matrix = 3;
}

// GetDivergences request
message GetDivergencesRequest {
  string pair = 1;
  string timeframe = 2;
  int32 lookback = 3; // 默认 200
  // 留空 = 全部启用：rsi / obv / macd
  repeated string indicators = 4;
}

message DivergenceEvent {
  string indicator = 1;     // rsi / obv / macd
  string kind = 2;          // bullish / bearish
  string detected_at = 3;   // RFC3339
  double price_pivot = 4;
  double indicator_pivot = 5;
  string note = 6;
}

message GetDivergencesResponse {
  string pair = 1;
  repeated DivergenceEvent events = 2;
}
