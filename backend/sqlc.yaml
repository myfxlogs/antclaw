version: "2"

sql:
  - engine: "postgresql"
    queries: "db/queries"
    schema: "internal/adapter/storage/postgres/migrations"
    gen:
      go:
        package: "db"
        out: "internal/adapter/storage/postgres/db"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_json_tags: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "inet"
            go_type: "net.IP"
